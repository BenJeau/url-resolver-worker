<!doctype html>
<html class="bg-black text-white h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex justify-center items-center h-full" onclick="document.getElementById('urlInput').focus()">
    <form id="resolverForm" class="flex flex-col items-center gap-3">
        <input id="urlInput" autocomplete="off" type="text" placeholder="start resolving your url" class="bg-transparent text-white text-2xl text-center outline-none border-none placeholder-white/30 w-xl" />
        <span class="text-white/30 text-sm tracking-widest uppercase">press enter</span>
    </form>
    <div id="resolverResult" class="hidden font-black text-center whitespace-wrap break-all bg-white text-black p-4 z-10 text-8xl inset-0 absolute flex items-center justify-center" onclick="this.classList.add('hidden')">
        <p id="backgroundText" class="absolute inset-0 text-xs font-mono text-black/10 overflow-hidden break-all leading-tight select-none pointer-events-none"></p>
        <p id="resolvedUrl" class="relative">Loading...</p>
    </div>
    <script>
      document.addEventListener('keydown', (e) => {
        const input = document.getElementById('urlInput');
        if (document.activeElement !== input && e.key.length === 1 && !e.metaKey && !e.ctrlKey) {
          input.focus();
        }
      });

      document.getElementById('resolverForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const url = document.getElementById('urlInput').value;
        const response = await fetch('https://resolver.jeaurond.dev/?user-agent=ios,android,macos,windows,none', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: url,
          tls: {
            rejectUnauthorized: false,
          }
        });

        const data = await response.json();

        const json = JSON.stringify(data, null, 2);
        const bg = document.getElementById('backgroundText');
        const repeated = (json + ' ').repeat(20);
        bg.textContent = repeated;

        document.getElementById('resolverResult').classList.remove('hidden');
        document.getElementById('resolvedUrl').textContent = data.urls.destination;

      });
    </script>
  </body>
</html>
