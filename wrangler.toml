name = "url-resolver"
main = "src/index.ts"
compatibility_date = "2026-03-18"
workers_dev = true
preview_urls = false

[vars]
MAX_HOPS = 10
UPSTREAM_TIMEOUT_MS = 8000
RESOLVER_USER_AGENT = "url-resolver/1.0"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
