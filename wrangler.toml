name = "url-resolver"
main = "src/index.ts"
compatibility_date = "2026-03-18"
workers_dev = false
preview_urls = false

[vars]
MAX_HOPS = 10
UPSTREAM_TIMEOUT_MS = 8000
CONTINUE_HOP_DOMAINS = ""
# Comma-separated list of allowed CORS origins, or "*" to allow any origin.
# Leave empty to disable CORS headers entirely.
# Example: "https://my-page.pages.dev,https://other.workers.dev"
CORS_ORIGINS = "*"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
